[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "packaging/vendor",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    # Require documentation for public Python modules, classes, functions and methods.
    "D100",
    "D101",
    "D102",
    "D103",
]
ignore = [
    # FastAPI dependency defaults intentionally call functions in signatures.
    "B008",
    # Formatting is enforced by Ruff; long protocol strings remain readable intact.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D100", "D101", "D102", "D103"]
"tests/test_network.py" = ["E701"]
"app/services/snmp.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = [
    "app/core/config.py",
    "app/core/device_schema.py",
    "app/services/database_schema.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "^(packaging/vendor|tests)/"

[[tool.mypy.overrides]]
module = ["pysnmp.*", "pyrad.*"]
ignore_missing_imports = true
