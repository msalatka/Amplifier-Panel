<section class="tab-panel" data-tab="overview">
    <div class="monitors-header"><div class="range-toolbar">
        <label>Range <select id="xml-history-range"><option value="5m">5 min</option><option value="1h">1 hour</option><option value="24h">24 hours</option><option value="7d">7 days</option><option value="30d">30 days</option><option value="all">All</option></select></label>
        <a id="xml-export" class="button button-secondary" href="/api/devices/{{ selected_device }}/history/export.csv?range=5m">Export CSV</a>
    </div><span id="xml-history-message" class="loading-status" role="status"></span></div>
    <details id="xml-chart-settings" class="chart-settings" data-operator-only>
        <summary>Configure charts</summary>
        <p>Assign measurements to the same chart to compare them.</p>
        <div id="xml-chart-field-settings" class="chart-field-settings"></div>
        <div class="chart-settings-actions">
            <button id="xml-cancel-chart-layout" class="button-secondary" type="button">Cancel</button>
            <button id="xml-save-chart-layout" class="button-primary" type="button">Save</button>
        </div>
    </details>
    <div id="xml-charts" class="charts-grid"></div>
</section>
<section class="tab-panel" data-tab="statistics">
    <div class="monitors-header"><h2>Statistics</h2><label>Range <select id="xml-statistics-range"><option value="5m">5 min</option><option value="1h" selected>1 hour</option><option value="24h">24 hours</option><option value="7d">7 days</option><option value="30d">30 days</option><option value="all">All</option></select></label></div>
    <div id="xml-statistics" class="data-panel"></div>
</section>
